<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Xuppu | Uproar!</title>

    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #fff;

            overflow-x: hidden;

            background:

                radial-gradient(
                    circle at 10% 15%,
                    rgba(255, 220, 80, 0.45),
                    transparent 22%
                ),

                radial-gradient(
                    circle at 90% 10%,
                    rgba(139, 70, 255, 0.65),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 15% 85%,
                    rgba(255, 190, 40, 0.35),
                    transparent 23%
                ),

                radial-gradient(
                    circle at 90% 85%,
                    rgba(175, 75, 255, 0.5),
                    transparent 20%
                ),

                linear-gradient(
                    135deg,
                    #090019 0%,
                    #17002f 25%,
                    #30065a 50%,
                    #1d0338 75%,
                    #070012 100%
                );

            background-attachment: fixed;
        }


        /* =========================
           GLOW OVERLAY
        ========================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 30%,
                    rgba(0, 0, 0, 0.45) 100%
                );

            z-index: 0;
        }


        /* =========================
           CENTRAL GLOW
        ========================= */

        body::after {

            content: "";

            position: fixed;

            width: 450px;

            height: 450px;

            border-radius: 50%;

            top: 15%;

            left: 50%;

            transform: translateX(-50%);

            background:

                radial-gradient(
                    circle,
                    rgba(255, 210, 50, 0.13),
                    transparent 70%
                );

            filter: blur(30px);

            pointer-events: none;

            animation:
                backgroundGlow 5s ease-in-out infinite;

            z-index: 0;
        }


        @keyframes backgroundGlow {

            0%,
            100% {
                opacity: 0.5;
                transform: translateX(-50%) scale(1);
            }

            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.25);
            }
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            min-height: 100vh;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 45px 20px;

            position: relative;

            z-index: 1;

            perspective: 1200px;
        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            font-size:
                clamp(50px, 8vw, 95px);

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 6px;

            color: #ffd83d;

            -webkit-text-stroke: 3px #160025;

            text-shadow:

                3px 4px 0 #ffffff,

                0 0 10px #ffe66b,

                0 0 25px #ffc400,

                0 0 50px rgba(255, 190, 0, 0.9),

                0 0 80px rgba(255, 170, 0, 0.6);

            margin-bottom: 5px;

            text-align: center;

            animation:
                titleShine 3s ease-in-out infinite;
        }


        @keyframes titleShine {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.35);
            }
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {

            font-size:
                clamp(16px, 3vw, 22px);

            color: #f5eaff;

            font-weight: bold;

            text-align: center;

            text-shadow:

                0 0 8px #8f45ff,

                0 0 15px rgba(160, 75, 255, 0.8);

            margin-bottom: 10px;
        }


        /* =========================
           UPROAR
        ========================= */

        .pounce {

            font-size:
                clamp(32px, 5vw, 58px);

            font-weight: 900;

            font-style: italic;

            text-transform: uppercase;

            letter-spacing: 3px;

            color: #ffe052;

            -webkit-text-stroke: 2px #160025;

            text-shadow:

                2px 3px 0 #ffffff,

                0 0 8px #ffffff,

                0 0 18px #ffd23f,

                0 0 35px #a348ff,

                0 0 60px rgba(180, 65, 255, 0.9);

            margin-bottom: 30px;

            transform: rotate(-2deg);

            text-align: center;

            animation:
                uproarGlow 2s ease-in-out infinite;
        }


        @keyframes uproarGlow {

            0%,
            100% {

                transform:
                    rotate(-2deg)
                    scale(1);

                filter: brightness(1);
            }

            50% {

                transform:
                    rotate(-2deg)
                    scale(1.06);

                filter: brightness(1.3);
            }
        }


        /* =========================
           MAIN CARD
        ========================= */

        .xuppu-card {

            position: relative;

            width:
                min(900px, 94vw);

            min-height: 520px;

            display: flex;

            align-items: center;

            justify-content: space-around;

            gap: 30px;

            padding: 45px;

            border-radius: 40px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.98) 0%,
                    rgba(255, 247, 208, 0.98) 23%,
                    rgba(255, 215, 82, 0.95) 48%,
                    rgba(132, 48, 190, 0.96) 75%,
                    rgba(43, 5, 75, 0.99) 100%
                );

            border: 3px solid #ffd83d;

            box-shadow:

                0 20px 45px
                rgba(0, 0, 0, 0.6),

                0 0 20px
                #ffc400,

                0 0 50px
                rgba(190, 65, 255, 0.8),

                0 0 100px
                rgba(255, 180, 0, 0.35),

                inset 5px 5px 20px
                rgba(255, 255, 255, 0.9),

                inset -10px -10px 25px
                rgba(60, 10, 90, 0.35);

            transform-style: preserve-3d;

            transition: 0.5s ease;

            overflow: hidden;

            animation:
                cardGlow 4s ease-in-out infinite;
        }


        @keyframes cardGlow {

            0%,
            100% {

                box-shadow:

                    0 20px 45px
                    rgba(0, 0, 0, 0.55),

                    0 0 20px #ffc400,

                    0 0 50px
                    rgba(180, 60, 255, 0.7),

                    0 0 100px
                    rgba(255, 180, 0, 0.35),

                    inset 5px 5px 20px
                    rgba(255, 255, 255, 0.9);
            }

            50% {

                box-shadow:

                    0 25px 50px
                    rgba(0, 0, 0, 0.65),

                    0 0 30px #ffe66b,

                    0 0 70px
                    rgba(200, 70, 255, 0.95),

                    0 0 120px
                    rgba(255, 190, 0, 0.55),

                    inset 5px 5px 25px
                    rgba(255, 255, 255, 1);
            }
        }


        .xuppu-card:hover {

            transform:

                rotateX(3deg)
                rotateY(-4deg)
                translateY(-10px)
                scale(1.01);

            box-shadow:

                0 30px 60px
                rgba(0, 0, 0, 0.7),

                0 0 35px #ffffff,

                0 0 70px #ffd83d,

                0 0 130px rgba(175, 60, 255, 0.95),

                inset 5px 5px 25px
                rgba(255, 255, 255, 1);
        }


        /* =========================
           SHINE ON CARD
        ========================= */

        .xuppu-card::after {

            content: "";

            position: absolute;

            width: 150%;

            height: 80px;

            left: -25%;

            top: 45%;

            background:
                rgba(255, 255, 255, 0.18);

            transform:
                rotate(-25deg);

            filter: blur(18px);

            pointer-events: none;

            animation:
                cardShine 5s ease-in-out infinite;
        }


        @keyframes cardShine {

            0% {
                transform:
                    translateX(-70%)
                    rotate(-25deg);
            }

            50% {
                transform:
                    translateX(70%)
                    rotate(-25deg);
            }

            100% {
                transform:
                    translateX(120%)
                    rotate(-25deg);
            }
        }


        /* =========================
           DECORATIVE CIRCLES
        ========================= */

        .circle {

            position: absolute;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    #ffffff 0%,
                    #ffe87d 40%,
                    #ffb700 65%,
                    #8d35c8 100%
                );

            opacity: 0.9;

            border: 2px solid #ffe994;

            box-shadow:

                0 0 15px #ffffff,

                0 0 30px #ffc400,

                0 0 45px #a63dff,

                inset 5px 5px 15px
                rgba(255, 255, 255, 0.9);

            pointer-events: none;
        }


        .circle.one {

            width: 190px;
            height: 190px;

            top: -100px;
            left: -70px;
        }


        .circle.two {

            width: 150px;
            height: 150px;

            bottom: -75px;
            right: 30px;
        }


        .circle.three {

            width: 90px;
            height: 90px;

            top: 35px;
            right: 70px;
        }


        .circle.four {

            width: 55px;
            height: 55px;

            bottom: 80px;
            left: 45%;
        }


        /* =========================
           XUPPU IMAGE AREA
        ========================= */

        .xuppu-image {

            position: relative;

            width: 48%;

            min-height: 400px;

            display: flex;

            align-items: center;

            justify-content: center;

            transform-style: preserve-3d;

            z-index: 3;
        }


        /* =========================
           GLOW CIRCLE
        ========================= */

        .xuppu-image::before {

            content: "";

            position: absolute;

            width: 320px;

            height: 320px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    #ffffff 0%,
                    #fff3a8 32%,
                    #ffd83d 58%,
                    #8d35c8 100%
                );

            border: 3px solid #ffffff;

            box-shadow:

                0 0 15px #ffffff,

                0 0 35px #ffd83d,

                0 0 70px #a33dff,

                0 0 110px
                rgba(180, 50, 255, 0.75),

                inset 10px 10px 25px
                rgba(255, 255, 255, 0.95);
        }


        /* =========================
           XUPPU IMAGE
        ========================= */

        .xuppu-image img {

            position: relative;

            width: 350px;

            height: 350px;

            object-fit: contain;

            z-index: 4;

            transform:
                translateZ(55px);

            filter:

                drop-shadow(
                    15px 20px 12px
                    rgba(20, 0, 35, 0.5)
                )

                drop-shadow(
                    0 0 12px #ffffff
                )

                drop-shadow(
                    0 0 30px #ffd23f
                )

                drop-shadow(
                    0 0 55px
                    rgba(177, 55, 255, 0.95)
                );

            animation:
                xuppuFloat 3s ease-in-out infinite;

            transition: 0.4s ease;
        }


        .xuppu-card:hover
        .xuppu-image img {

            transform:

                translateZ(75px)
                scale(1.08);

            filter:

                drop-shadow(
                    18px 25px 12px
                    rgba(20, 0, 35, 0.55)
                )

                drop-shadow(
                    0 0 15px #ffffff
                )

                drop-shadow(
                    0 0 35px #ffe052
                )

                drop-shadow(
                    0 0 70px
                    rgba(190, 70, 255, 1)
                );
        }


        /* =========================
           FLOATING ANIMATION
        ========================= */

        @keyframes xuppuFloat {

            0%,
            100% {

                transform:
                    translateZ(55px)
                    translateY(0);
            }

            50% {

                transform:
                    translateZ(75px)
                    translateY(-14px);
            }
        }


        /* =========================
           INFORMATION
        ========================= */

        .info {

            width: 45%;

            position: relative;

            z-index: 5;

            transform:
                translateZ(45px);

            padding: 20px;
        }


        .info h2 {

            font-size:
                clamp(38px, 5vw, 55px);

            color: #ffd23f;

            -webkit-text-stroke: 2px #2a0645;

            text-shadow:

                2px 3px 0 #ffffff,

                0 0 12px #ffffff,

                0 0 25px #ffc400,

                0 0 45px #9b35d5;

            margin-bottom: 18px;
        }


        .info p {

            font-size: 19px;

            line-height: 1.7;

            color: #2b0646;

            font-weight: 700;

            text-shadow:
                1px 1px 2px #ffffff;
        }


        /* =========================
           POWER BOX
        ========================= */

        .power {

            margin-top: 25px;

            padding: 18px 20px;

            background:
                rgba(255, 255, 255, 0.93);

            border: 2px solid #ffd23f;

            border-left: 7px solid #9b35d5;

            border-radius: 12px;

            color: #29063f;

            font-size: 18px;

            box-shadow:

                0 10px 20px
                rgba(20, 0, 35, 0.3),

                0 0 20px
                rgba(255, 200, 50, 0.4);
        }


        .power strong {

            color: #8730c4;

            font-size: 20px;

            text-shadow:
                0 0 8px
                rgba(135, 48, 196, 0.5);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {

            margin-top: 30px;

            padding: 15px 35px;

            border: 3px solid #ffe89a;

            border-radius: 35px;

            background:

                linear-gradient(
                    135deg,
                    #ffd23f,
                    #9b35d5
                );

            color: #ffffff;

            font-size: 18px;

            font-weight: 900;

            text-decoration: none;

            box-shadow:

                0 8px 20px
                rgba(0, 0, 0, 0.45),

                0 0 20px #ffc400,

                0 0 40px
                rgba(175, 55, 255, 0.7);

            transition: 0.3s ease;

            z-index: 5;
        }


        .back-btn:hover {

            background:
                #ffffff;

            color: #8b30c8;

            border-color: #ffffff;

            transform:

                translateY(-6px)
                scale(1.05);

            box-shadow:

                0 12px 30px
                rgba(0, 0, 0, 0.5),

                0 0 25px #ffffff,

                0 0 50px #a83dff;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .container {

                padding:
                    35px 15px;
            }


            h1 {

                font-size: 50px;

                letter-spacing: 3px;
            }


            .pounce {

                font-size: 32px;
            }


            .xuppu-card {

                flex-direction: column;

                padding:
                    35px 20px;

                min-height: auto;

                gap: 10px;
            }


            .xuppu-image {

                width: 100%;

                min-height: 330px;
            }


            .xuppu-image::before {

                width: 250px;

                height: 250px;
            }


            .xuppu-image img {

                width: 280px;

                height: 280px;
            }


            .info {

                width: 100%;

                text-align: center;

                padding: 10px;
            }


            .info h2 {

                font-size: 40px;
            }


            .info p {

                font-size: 16px;
            }


            .power {

                text-align: left;
            }


            .circle.one {

                width: 120px;

                height: 120px;
            }


            .circle.two {

                width: 100px;

                height: 100px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             TITLE
        ========================= -->

        <h1>XUPPU</h1>


        <p class="subtitle">
            The Kwami of Exaltation
        </p>


        <!-- =========================
             CATCHPHRASE
        ========================= -->

        <h2 class="pounce">
            UPROAR!
        </h2>


        <!-- =========================
             MAIN CARD
        ========================= -->

        <div class="xuppu-card">


            <!-- Decorative circles -->

            <div class="circle one"></div>

            <div class="circle two"></div>

            <div class="circle three"></div>

            <div class="circle four"></div>


            <!-- =========================
                 XUPPU IMAGE
            ========================= -->

            <div class="xuppu-image">

                <!--
                    Change xuppu.png
                    to your actual image filename.
                -->
                    <img
                    src="xuppu1.png"
                    alt="Xuppu"
                >

            </div>


            <!-- INFORMATION -->

            <div class="info">

                <h2>XUPPU</h2>

                <p>
                    Xuppu is the kwami associated
                    with the Monkey Miraculous.
                    He represents exaltation,
                    mischief and unpredictability.
                </p>


                <div class="power">

                    <strong>POWER:</strong>

                    <br>

                    Uproar-creates an object taht disrupts and
                    interferes with the opponent's powers.

                </div>

            </div>


        </div>


        <!-- BACK BUTTON -->

        <a
            href="akuma.html"
            class="back-btn"
        >
            ← BACK TO MIRACULOUS
        </a>


    </div>


</body>
</html>
