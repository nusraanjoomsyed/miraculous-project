<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Barkk | Let's Hunt!</title>

    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #ffffff;

            overflow-x: hidden;

            background:

                radial-gradient(
                    circle at 10% 15%,
                    rgba(255,255,255,0.25),
                    transparent 22%
                ),

                radial-gradient(
                    circle at 90% 10%,
                    rgba(255,150,40,0.35),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 15% 85%,
                    rgba(255,210,130,0.25),
                    transparent 23%
                ),

                radial-gradient(
                    circle at 90% 85%,
                    rgba(255,120,0,0.30),
                    transparent 20%
                ),

                linear-gradient(
                    135deg,
                    #160800 0%,
                    #3b1500 20%,
                    #8a3d00 40%,
                    #d97812 55%,
                    #633000 75%,
                    #080300 100%
                );

            background-attachment: fixed;
        }


        /* =========================
           DARK OVERLAY
        ========================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 20%,
                    rgba(0,0,0,0.62) 100%
                );

            z-index: 0;
        }


        /* =========================
           CENTRAL ORANGE GLOW
        ========================= */

        body::after {

            content: "";

            position: fixed;

            width: 520px;

            height: 520px;

            border-radius: 50%;

            top: 10%;

            left: 50%;

            transform: translateX(-50%);

            background:

                radial-gradient(
                    circle,
                    rgba(255,190,90,0.30),
                    rgba(255,100,0,0.12),
                    transparent 70%
                );

            filter: blur(40px);

            pointer-events: none;

            animation:
                backgroundGlow 5s ease-in-out infinite;

            z-index: 0;
        }


        @keyframes backgroundGlow {

            0%,
            100% {

                opacity: 0.55;

                transform:
                    translateX(-50%)
                    scale(1);
            }

            50% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    scale(1.2);
            }
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            min-height: 100vh;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 45px 20px;

            position: relative;

            z-index: 1;

            perspective: 1200px;
        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            font-size:
                clamp(50px, 8vw, 95px);

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 6px;

            color: #fff5df;

            -webkit-text-stroke: 3px #180700;

            text-shadow:

                3px 4px 0 #713000,

                0 0 8px #ffffff,

                0 0 20px #ffb84d,

                0 0 40px rgba(255,130,0,0.9),

                0 0 65px rgba(255,180,60,0.6);

            margin-bottom: 5px;

            text-align: center;

            animation:
                titleShine 3s ease-in-out infinite;
        }


        @keyframes titleShine {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.4);
            }
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {

            font-size:
                clamp(16px, 3vw, 22px);

            color: #ffe1ad;

            font-weight: bold;

            text-align: center;

            text-shadow:

                0 0 6px #ffffff,

                0 0 12px #ff9d28;

            margin-bottom: 10px;
        }


        /* =========================
           CATCHPHRASE
        ========================= */

        .pounce {

            font-size:
                clamp(32px, 5vw, 58px);

            font-weight: 900;

            font-style: italic;

            text-transform: uppercase;

            letter-spacing: 3px;

            color: #ffffff;

            -webkit-text-stroke: 2px #180700;

            text-shadow:

                2px 3px 0 #653000,

                0 0 8px #ffffff,

                0 0 18px #ffd28a,

                0 0 35px #ff8c00,

                0 0 60px rgba(255,120,0,0.9);

            margin-bottom: 30px;

            transform: rotate(-2deg);

            text-align: center;

            animation:
                barkkGlow 2s ease-in-out infinite;
        }


        @keyframes barkkGlow {

            0%,
            100% {

                transform:
                    rotate(-2deg)
                    scale(1);

                filter: brightness(1);
            }

            50% {

                transform:
                    rotate(-2deg)
                    scale(1.06);

                filter: brightness(1.35);
            }
        }


        /* =========================
           MAIN CARD
        ========================= */

        .barkk-card {

            position: relative;

            width:
                min(900px, 94vw);

            min-height: 520px;

            display: flex;

            align-items: center;

            justify-content: space-around;

            gap: 30px;

            padding: 45px;

            border-radius: 40px;

            background:

                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #fff0d0 18%,
                    #e7a044 40%,
                    #a9520b 62%,
                    #4a1c00 82%,
                    #100400 100%
                );

            border: 3px solid #ffffff;

            box-shadow:

                0 20px 45px
                rgba(50,15,0,0.85),

                0 0 20px
                rgba(255,255,255,0.9),

                0 0 50px
                rgba(255,145,0,0.7),

                0 0 100px
                rgba(255,100,0,0.35),

                inset 5px 5px 20px
                rgba(255,255,255,0.95),

                inset -10px -10px 25px
                rgba(50,15,0,0.65);

            transform-style: preserve-3d;

            transition: 0.5s ease;

            overflow: hidden;

            animation:
                cardGlow 4s ease-in-out infinite;
        }


        /* =========================
           CARD GLOW
        ========================= */

        @keyframes cardGlow {

            0%,
            100% {

                box-shadow:

                    0 20px 45px
                    rgba(50,15,0,0.85),

                    0 0 20px
                    rgba(255,255,255,0.75),

                    0 0 50px
                    rgba(255,145,0,0.6),

                    0 0 100px
                    rgba(255,100,0,0.25),

                    inset 5px 5px 20px
                    rgba(255,255,255,0.9);
            }

            50% {

                box-shadow:

                    0 25px 55px
                    rgba(45,10,0,0.95),

                    0 0 30px
                    #ffffff,

                    0 0 70px
                    rgba(255,170,30,0.95),

                    0 0 120px
                    rgba(255,100,0,0.45),

                    inset 5px 5px 25px
                    rgba(255,255,255,1);
            }
        }


        /* =========================
           CARD HOVER
        ========================= */

        .barkk-card:hover {

            transform:

                rotateX(3deg)
                rotateY(-4deg)
                translateY(-10px)
                scale(1.01);

            box-shadow:

                0 30px 60px
                rgba(40,10,0,0.95),

                0 0 35px #ffffff,

                0 0 70px #ffb52e,

                0 0 130px
                rgba(255,100,0,0.9),

                inset 5px 5px 25px
                rgba(255,255,255,1);
        }


        /* =========================
           CARD SHINE
        ========================= */

        .barkk-card::after {

            content: "";

            position: absolute;

            width: 150%;

            height: 80px;

            left: -25%;

            top: 45%;

            background:
                rgba(255,255,255,0.35);

            transform:
                rotate(-25deg);

            filter: blur(18px);

            pointer-events: none;

            animation:
                cardShine 5s ease-in-out infinite;
        }


        @keyframes cardShine {

            0% {

                transform:
                    translateX(-70%)
                    rotate(-25deg);
            }

            50% {

                transform:
                    translateX(70%)
                    rotate(-25deg);
            }

            100% {

                transform:
                    translateX(120%)
                    rotate(-25deg);
            }
        }


        /* =========================
           DECORATIVE CIRCLES
        ========================= */

        .circle {

            position: absolute;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    #ffffff 0%,
                    #ffe8c4 35%,
                    #ff9f28 65%,
                    #552000 100%
                );

            opacity: 0.92;

            border: 2px solid #ffffff;

            box-shadow:

                0 0 15px #ffffff,

                0 0 30px #ffbd4a,

                0 0 45px rgba(255,120,0,0.7),

                inset 5px 5px 15px
                rgba(255,255,255,0.95);

            pointer-events: none;
        }


        .circle.one {

            width: 190px;
            height: 190px;

            top: -100px;
            left: -70px;
        }


        .circle.two {

            width: 150px;
            height: 150px;

            bottom: -75px;
            right: 30px;
        }


        .circle.three {

            width: 90px;
            height: 90px;

            top: 35px;
            right: 70px;
        }


        .circle.four {

            width: 55px;
            height: 55px;

            bottom: 80px;
            left: 45%;
        }


        /* =========================
           BARKK IMAGE AREA
        ========================= */

        .barkk-image {

            position: relative;

            width: 48%;

            min-height: 400px;

            display: flex;

            align-items: center;

            justify-content: center;

            transform-style: preserve-3d;

            z-index: 3;
        }


        /* =========================
           IMAGE GLOW
        ========================= */

        .barkk-image::before {

            content: "";

            position: absolute;

            width: 320px;

            height: 320px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    #ffffff 0%,
                    #fff0d5 30%,
                    #ffbd50 58%,
                    #d85c00 100%
                );

            border: 3px solid #ffffff;

            box-shadow:

                0 0 15px #ffffff,

                0 0 35px #ffd070,

                0 0 70px #ff8c00,

                0 0 110px
                rgba(255,100,0,0.8),

                inset 10px 10px 25px
                rgba(255,255,255,0.98);
        }


        /* =========================
           BARKK IMAGE
        ========================= */

        .barkk-image img {

            position: relative;

            width: 350px;

            height: 350px;

            object-fit: contain;

            z-index: 4;

            transform:
                translateZ(55px);

            filter:

                drop-shadow(
                    15px 20px 12px
                    rgba(45,15,0,0.75)
                )

                drop-shadow(
                    0 0 12px #ffffff
                )

                drop-shadow(
                    0 0 30px #ffc45c
                )

                drop-shadow(
                    0 0 55px
                    rgba(255,110,0,0.95)
                );

            animation:
                barkkFloat 3s ease-in-out infinite;

            transition: 0.4s ease;
        }


        /* =========================
           IMAGE HOVER
        ========================= */

        .barkk-card:hover
        .barkk-image img {

            transform:

                translateZ(75px)
                scale(1.08);

            filter:

                drop-shadow(
                    18px 25px 12px
                    rgba(45,10,0,0.85)
                )

                drop-shadow(
                    0 0 15px #ffffff
                )

                drop-shadow(
                    0 0 35px #ffd27a
                )

                drop-shadow(
                    0 0 70px
                    rgba(255,100,0,1)
                );
        }


        /* =========================
           FLOATING ANIMATION
        ========================= */

        @keyframes barkkFloat {

            0%,
            100% {

                transform:
                    translateZ(55px)
                    translateY(0);
            }

            50% {

                transform:
                    translateZ(75px)
                    translateY(-14px);
            }
        }


        /* =========================
           INFORMATION
        ========================= */

        .info {

            width: 45%;

            position: relative;

            z-index: 5;

            transform:
                translateZ(45px);

            padding: 20px;
        }


        .info h2 {

            font-size:
                clamp(38px, 5vw, 55px);

            color: #ffffff;

            -webkit-text-stroke: 2px #572000;

            text-shadow:

                2px 3px 0 #873700,

                0 0 12px #ffffff,

                0 0 25px #ffbd3d,

                0 0 45px #ed7100;

            margin-bottom: 18px;
        }


        .info p {

            font-size: 19px;

            line-height: 1.7;

            color: #fff5e5;

            font-weight: 700;

            text-shadow:
                1px 1px 3px #4a1800;
        }


        /* =========================
           POWER BOX
        ========================= */

        .power {

            margin-top: 25px;

            padding: 18px 20px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.98),
                    rgba(255,224,170,0.95),
                    rgba(150,65,0,0.96)
                );

            border: 2px solid #ffffff;

            border-left: 7px solid #e86b00;

            border-radius: 12px;

            color: #181000;

            font-size: 18px;

            box-shadow:

                0 10px 20px
                rgba(70,20,0,0.6),

                0 0 20px
                rgba(255,170,0,0.55);
        }


        .power strong {

            color: #b54c00;

            font-size: 20px;

            text-shadow:
                0 0 8px
                rgba(255,150,0,0.65);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {

            margin-top: 30px;

            padding: 15px 35px;

            border: 3px solid #ffffff;

            border-radius: 35px;

            background:

                linear-gradient(
                    135deg,
                    #ffad38,
                    #a94b00,
                    #260b00
                );

            color: #ffffff;

            font-size: 18px;

            font-weight: 900;

            text-decoration: none;

            box-shadow:

                0 8px 20px
                rgba(50,15,0,0.75),

                0 0 15px #ffffff,

                0 0 30px
                rgba(255,150,0,0.65);

            transition: 0.3s ease;

            z-index: 5;
        }


        .back-btn:hover {

            background:

                linear-gradient(
                    135deg,
                    #ffffff,
                    #ffe2a0
                );

            color: #351000;

            border-color: #ffffff;

            transform:

                translateY(-6px)
                scale(1.05);

            box-shadow:

                0 12px 30px
                rgba(60,15,0,0.7),

                0 0 25px #ffffff,

                0 0 50px #ff9800;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .container {

                padding:
                    35px 15px;
            }


            h1 {

                font-size: 50px;

                letter-spacing: 3px;
            }


            .pounce {

                font-size: 32px;
            }


            .barkk-card {

                flex-direction: column;

                padding:
                    35px 20px;

                min-height: auto;

                gap: 10px;
            }


            .barkk-image {

                width: 100%;

                min-height: 330px;
            }


            .barkk-image::before {

                width: 250px;

                height: 250px;
            }


            .barkk-image img {

                width: 280px;

                height: 280px;
            }


            .info {

                width: 100%;

                text-align: center;

                padding: 10px;
            }


            .info h2 {

                font-size: 40px;
            }


            .info p {

                font-size: 16px;
            }


            .power {

                text-align: left;
            }


            .circle.one {

                width: 120px;

                height: 120px;
            }


            .circle.two {

                width: 100px;

                height: 100px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             TITLE
        ========================= -->

        <h1>BARKK</h1>


        <p class="subtitle">
            The Kwami of Adoration
        </p>


        <!-- =========================
             CATCHPHRASE
        ========================= -->

        <h2 class="pounce">
            Let's Hunt!
        </h2>
        <div class="barkk-card">
            <div class="circle one"></div>
            <div class="circle two"></div>
            <div class="circle three"></div>
            <div class="circle four"></div>

            <div class="barkk-image">
                <img 
                src="barkk1.png" alt="Barkk"
            >
            </div>
            <div class="info">
                <h2>Barkk</h2>
                <p>
                    Barkk is the kwami associated with the dog miraculous.
                    Loyal,energetic and playful,Barkk has a strong sense of determination
                    and devotion.
                </p>
                <div class="power">
                    <strong>Power:</strong>
                    <br>
                    Fetch-allows the holder to retrieve an object by marking
                    and summoning it back.
                </div>
                </div>
                </div>
                <a
                 href="akuma.html" 
                 class="back-btn"
                 >
                ← Back to Miraculous
            </a>
            </div>
            </body>
            </html>
