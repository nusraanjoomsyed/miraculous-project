<!DOCTYPE html>

    <style>
        body{
            margin:0;
            min-height:100vh;
            background-color:#e60026;

            /* Ladybug spots */
            background-image:
                radial-gradient(circle, black 40px, transparent 41px);
            background-size:180px 180px;

            font-family:Arial, sans-serif;
        }

        .hero{
            text-align:center;
            color:white;
            padding:40px 20px;
        }

        .hero h1{
            font-size:70px;
            margin:0;
            text-shadow:0 0 20px black;
            animation:floatText 2s ease-in-out infinite alternate;
        }

        .hero p{
            font-size:22px;
            margin-top:10px;
        }

        @keyframes floatText{
            from{transform:translateY(0);}
            to{transform:translateY(-15px);}
        }

        .miraculous-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:20px;
            padding:30px;
            max-width:1400px;
            margin:auto;
        }

        .card{
            background:rgba(255,255,255,0.15);
            border-radius:20px;
            padding:20px;
            text-align:center;
            cursor:pointer;
            transition:0.4s;
        }

        .card:hover{
            transform:scale(1.05);
            background:rgba(255,255,255,0.25);
        }

        .card img{
            width:120px;
            height:120px;
            object-fit:contain;
        }

        .card h3{
            color:white;
        }
    </style>
</head>
